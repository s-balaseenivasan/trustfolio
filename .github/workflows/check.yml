name: Check

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trustfolio
          POSTGRES_PASSWORD: trustfolio_test
          POSTGRES_DB: trustfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustfolio -d trustfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://trustfolio:trustfolio_test@127.0.0.1:5432/trustfolio_test
      AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:db
